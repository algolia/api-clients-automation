name: Setup

description: Setup CI environment.

inputs:
  type:
    description: Type of setup, `minimal` will only setup the JavaScript monorepo, empty will also install Java.
    required: false
  language:
    description: the language for which to install deps
    required: false
  version:
    description: the version of the language to setup
    required: false

runs:
  using: composite
  steps:
    # Java for code generation
    - name: Install Java
      if: inputs.type != 'minimal'
      uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
      with:
        distribution: zulu
        java-version-file: config/.java-version

    - name: Setup gradle
      if: inputs.type != 'minimal'
      uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      with:
        validate-wrappers: true
        cache-provider: basic
        add-job-summary: 'on-failure'

    - name: Download Java formatter
      if: inputs.type != 'minimal'
      shell: bash
      env:
        # renovate: datasource=github-release-attachments depName=google/google-java-format asset=google-java-format-{version}-all-deps.jar
        JAVA_FORMATTER_PIN: v2.0.0@c78feb48c549fa7114b7ea11db3b456808f7b371ffe84e6643a44dd2f9588639
      run: |
        version="${JAVA_FORMATTER_PIN%@*}"
        curl -f --retry 3 -L "https://github.com/google/google-java-format/releases/download/${version}/google-java-format-${version#v}-all-deps.jar" -o /tmp/java-formatter.jar
        echo "${JAVA_FORMATTER_PIN#*@}  /tmp/java-formatter.jar" | shasum -a 256 -c -

    # JavaScript for monorepo and tooling
    - name: Install Node
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version-file: .nvmrc
        cache: yarn

    - name: Install JavaScript dependencies
      shell: bash
      run: YARN_ENABLE_HARDENED_MODE=1 yarn install

    # Csharp
    - name: Install dotnet
      if: ${{ inputs.language == 'csharp' }}
      uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
      with:
        dotnet-version: ${{ inputs.version }}

    # Dart
    - name: Install dart
      if: ${{ inputs.language == 'dart' }}
      uses: dart-lang/setup-dart@2286a0c042b44434fe26d292bbce8d34f7ec662b # v1.8.2
      with:
        sdk: ${{ inputs.version }}
        problem-matcher: 'false'

    - name: Setup dart tools
      if: ${{ inputs.language == 'dart' }}
      shell: bash
      run: dart pub global activate melos

    # Golang
    - name: Install golang
      if: ${{ inputs.language == 'go' }}
      uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
      with:
        cache-dependency-path: clients/algoliasearch-client-go/go.sum
        go-version: ${{ inputs.version }}

    - name: Install golangci-lint
      if: ${{ inputs.language == 'go' }}
      shell: bash
      env:
        # renovate: datasource=github-tags depName=golangci/golangci-lint
        GOLANGCI_LINT_PIN: v2.15.0@25c5369a93aacb8cccea0d46e1569ca4a194564d
      run: |
        curl --retry 3 -sSfL "https://raw.githubusercontent.com/golangci/golangci-lint/${GOLANGCI_LINT_PIN#*@}/install.sh" -o /tmp/golangci-install.sh
        sh /tmp/golangci-install.sh -b $(go env GOPATH)/bin "${GOLANGCI_LINT_PIN%@*}"
        go install golang.org/x/tools/cmd/goimports@v0.22.0
        echo "$(go env GOPATH)/bin" >> $GITHUB_PATH

    - name: Cache golangci-lint analysis
      if: ${{ inputs.language == 'go' }}
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.cache/golangci-lint
        key: golangci-lint-${{ inputs.version }}-${{ hashFiles('clients/algoliasearch-client-go/go.sum') }}

    # JavaScript client deps
    - name: Get yarn js-client cache directory path
      if: ${{ inputs.language == 'javascript' }}
      shell: bash
      id: yarn-cache-dir-client
      run: echo "dir=$(cd clients/algoliasearch-client-javascript && yarn config get cacheFolder)" >> $GITHUB_OUTPUT

    - name: Restore Yarn js-client
      if: ${{ inputs.language == 'javascript' }}
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ steps.yarn-cache-dir-client.outputs.dir || 'clients/algoliasearch-client-javascript/.yarn/cache' }}
        key: yarn-cache-clients-${{ hashFiles('clients/algoliasearch-client-javascript/yarn.lock') }}

    - name: Install JavaScript client dependencies
      if: ${{ inputs.language == 'javascript' }}
      shell: bash
      run: cd clients/algoliasearch-client-javascript && YARN_ENABLE_HARDENED_MODE=1 yarn install

    # PHP
    - name: Install PHP
      if: ${{ inputs.language == 'php' }}
      uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
      with:
        php-version: ${{ inputs.version }}
        tools: composer

    - name: Run composer install
      if: ${{ inputs.language == 'php' }}
      shell: bash
      run: |
        composer install --working-dir=clients/algoliasearch-client-php
        composer dump-autoload --working-dir=clients/algoliasearch-client-php

    # Python
    - name: Install poetry
      if: ${{ inputs.language == 'python' }}
      shell: bash
      run: pipx install poetry==2

    - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      if: ${{ inputs.language == 'python' }}
      with:
        python-version: ${{ inputs.version }}
        cache: 'poetry'

    - run: poetry install
      if: ${{ inputs.language == 'python' }}
      working-directory: clients/algoliasearch-client-python
      shell: bash

    # Ruby
    - name: Install Ruby
      if: ${{ inputs.language == 'ruby' }}
      uses: ruby/setup-ruby@f9c4492e86def3e644ab32a0ef185eda5b0c20d0 # v1.342.0
      with:
        ruby-version: ${{ inputs.version }}
        bundler-cache: true

    - name: Install Ruby formatter
      if: ${{ inputs.language == 'ruby' }}
      shell: bash
      env:
        # renovate: datasource=github-release-attachments depName=fables-tales/rubyfmt asset=rubyfmt-{tag}-Linux-x86_64.tar.gz
        RUBYFMT_PIN_X86_64: v0.14.1@9590cc3b8b2ed37a250a5f7c22a542ce014f13954f613c93a72230de8a74fbbd
      run: |
        version="${RUBYFMT_PIN_X86_64%@*}"
        curl -f --retry 3 -L "https://github.com/fables-tales/rubyfmt/releases/download/${version}/rubyfmt-${version}-Linux-x86_64.tar.gz" -o rubyfmt.tar.gz
        echo "${RUBYFMT_PIN_X86_64#*@}  rubyfmt.tar.gz" | shasum -a 256 -c -
        tar -xzf rubyfmt.tar.gz
        mv "tmp/releases/${version}-Linux/rubyfmt" /usr/local/bin
        rm -rf rubyfmt.tar.gz tmp

    # Scala
    - name: Install sbt
      if: ${{ inputs.language == 'scala' }}
      uses: sbt/setup-sbt@20cf087132cf939c160f0e53f87ba33634003e3e # v1.5.16

    # Swift deps
    - name: Install swift
      if: ${{ inputs.language == 'swift' }}
      uses: swift-actions/setup-swift@7ca6abe6b3b0e8b5421b88be48feee39cbf52c6a # v2.4.0
      with:
        swift-version: ${{ inputs.version }}

    - name: Cache the build folder
      id: cache-swift-build
      if: ${{ inputs.language == 'swift' }}
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          clients/algoliasearch-client-swift/.build
        key: swift-build-${{ inputs.version }}-${{ runner.os }}

    # SWIFTFORMAT_SHA is the commit the SWIFTFORMAT_VERSION tag points at; the checkout below is
    # built from source and put on PATH, so it must not follow a tag that can be moved
    - name: Set swiftformat version
      if: ${{ inputs.language == 'swift' }}
      id: swiftformat-version
      shell: bash
      run: |
        echo "SWIFTFORMAT_VERSION=0.64.7" >> $GITHUB_OUTPUT
        echo "SWIFTFORMAT_SHA=d5ca3e440886ea8b3d5b405928b1dae5e80d7ce2" >> $GITHUB_OUTPUT

    - name: Checkout swiftformat
      if: ${{ inputs.language == 'swift' }}
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        repository: nicklockwood/SwiftFormat
        ref: ${{ steps.swiftformat-version.outputs.SWIFTFORMAT_SHA }}
        path: swiftformat

    - name: Cache the build folder for swiftformat
      id: cache-swiftformat
      if: ${{ inputs.language == 'swift' }}
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: swiftformat/.build
        key: swiftformat-build-${{ steps.swiftformat-version.outputs.SWIFTFORMAT_SHA }}-${{ runner.os }}-swift-${{ inputs.version }}

    - name: Build swiftformat
      if: ${{ inputs.language == 'swift' && steps.cache-swiftformat.outputs.cache-hit != 'true' }}
      shell: bash
      run: cd swiftformat && swift build -c release

    - name: Setup the path
      if: ${{ inputs.language == 'swift' }}
      shell: bash
      run: echo "$(pwd)/swiftformat/.build/release" >> $GITHUB_PATH
