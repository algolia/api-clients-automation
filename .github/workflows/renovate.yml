name: Renovate

on:
  schedule:
    - cron: '0 14 * * 5' # At 14:00 on Friday.
  workflow_dispatch:

# the renovate action only uses the app token, never GITHUB_TOKEN
permissions: {}

jobs:
  renovate:
    runs-on: ubuntu-latest
    steps:
      - name: Generate GitHub App Token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.ALGOLIA_BOT_CLIENT_ID }}
          private-key: ${{ secrets.ALGOLIA_BOT_PRIVATE_KEY }}

      - name: Renovate Automatic Branch
        uses: bodinsamuel/renovate-automatic-branch@8a2f5201c591e669091cea33195ad108dbcf34a1 # v1.0.13
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          repo-owner: algolia
          repo-name: api-clients-automation
          pull-request-title: 'chore(deps): dependencies'
          pull-request-body: |
            Weekly dependencies update.
            Contribute to #532
