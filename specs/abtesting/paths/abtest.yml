get:
  tags:
    - abtest
  operationId: getABTest
  deprecated: true
  x-acl:
    - analytics
  summary: Retrieve A/B test details
  description: |
    This endpoint is deprecated. Use the A/B Testing API v3 instead.

    Replaced by `GET /3/abtests/{id}`.

    Retrieves the details for an A/B test by its ID.
  parameters:
    - $ref: '../common/parameters.yml#/ID'
  responses:
    '200':
      description: OK
      headers:
        x-ratelimit-limit:
          $ref: '../../common/responses/rateLimit.yml#/x-ratelimit-limit'
        x-ratelimit-remaining:
          $ref: '../../common/responses/rateLimit.yml#/x-ratelimit-remaining'
        x-ratelimit-reset:
          $ref: '../../common/responses/rateLimit.yml#/x-ratelimit-reset'
      content:
        application/json:
          schema:
            $ref: '../common/schemas/ABTest.yml#/ABTest'
    '400':
      $ref: '../../common/responses/BadRequest.yml'
    '402':
      $ref: '../../common/responses/FeatureNotEnabled.yml'
    '403':
      $ref: '../../common/responses/MethodNotAllowed.yml'
    '404':
      $ref: '../../common/responses/IndexNotFound.yml'

delete:
  tags:
    - abtest
  operationId: deleteABTest
  deprecated: true
  x-acl:
    - editSettings
  summary: Delete an A/B test
  description: |
    This endpoint is deprecated. Use the A/B Testing API v3 instead.

    Replaced by `DELETE /3/abtests/{id}`.

    Deletes an A/B test by its ID.
  parameters:
    - $ref: '../common/parameters.yml#/ID'
  responses:
    '200':
      description: OK
      headers:
        x-ratelimit-limit:
          $ref: '../../common/responses/rateLimit.yml#/x-ratelimit-limit'
        x-ratelimit-remaining:
          $ref: '../../common/responses/rateLimit.yml#/x-ratelimit-remaining'
        x-ratelimit-reset:
          $ref: '../../common/responses/rateLimit.yml#/x-ratelimit-reset'
      content:
        application/json:
          schema:
            $ref: '../common/schemas/ABTestResponse.yml#/ABTestResponse'
    '400':
      $ref: '../../common/responses/BadRequest.yml'
    '402':
      $ref: '../../common/responses/FeatureNotEnabled.yml'
    '403':
      $ref: '../../common/responses/MethodNotAllowed.yml'
    '404':
      $ref: '../../common/responses/IndexNotFound.yml'
