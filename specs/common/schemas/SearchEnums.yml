advancedSyntaxFeatures:
  type: string
  enum: [exactPhrase, excludeWords]
  x-categories:
    - Query strategy

alternativesAsExact:
  type: string
  enum: [ignorePlurals, singleWordSynonym, multiWordsSynonym, ignoreConjugations]
  x-categories:
    - Query strategy

attributeCriteriaComputedBy:
  type: string
  title: attribute criteria computed by
  enum: [minProximity, best, sum]
  description: |
    Strategy for computing the Attribute ranking criterion.
    This mainly affects multi-word queries where matches occur in and across multiple attributes.

    - `minProximity`.
      Determine the best matching attribute from those with the best proximity score.
      This is the default when Attribute follows Proximity in the `ranking` setting.
      Ties on an ordered attribute are broken by the match position.
    - `best`.
      Determine the best matching attribute from all attributes matching any query term.
      This is the default when Attribute comes before Proximity in the `ranking` setting.
      Ties on an ordered attribute are broken by the match position.
    - `sum`.
      Instead of picking one best attribute, add up a score for every query word.
      Each word's score depends on which attribute it matched (and, for ordered attributes, where in that attribute).
      Records with a lower total score rank higher.
      This stops a record from ranking high just because one word of a multi-word query matched in a top attribute.
      For most use cases, use `sum` when you place Attribute before Proximity in the `ranking` setting, especially for indices with short, relevant attributes.
      For long-text fields, set those attributes to unordered.
  x-categories:
    - Advanced

typoToleranceEnum:
  type: string
  title: typo tolerance
  description: |
    - `min`. Return matches with the lowest number of typos.
      For example, if you have matches without typos, only include those.
      But if there are no matches without typos (with 1 typo), include matches with 1 typo (2 typos).
    - `strict`. Return matches with the two lowest numbers of typos.
      With `strict`, the Typo ranking criterion is applied first in the `ranking` setting.
  enum: [min, strict, 'true', 'false']
