# path
DictionaryName:
  in: path
  name: dictionaryName
  description: Dictionary type in which to search.
  required: true
  schema:
    $ref: '#/dictionaryType'

dictionaryType:
  type: string
  enum: [plurals, stopwords, compounds]

standardEntries:
  type: object
  description: |
    Turn off the built-in Algolia stop words for specific languages.
    Only `stopwords` is supported.
    The keys of the `stopwords` object are [language ISO codes](https://www.algolia.com/doc/guides/managing-results/optimize-search-results/handling-natural-languages-nlp/in-depth/supported-languages) of languages with a built-in stop-word dictionary.
  additionalProperties: false
  properties:
    plurals:
      deprecated: true
      description: |
        Not supported. The API rejects this property with HTTP 400.
        You cannot turn off the built-in plurals dictionary.
      $ref: '#/standardEntry'
    stopwords:
      $ref: '#/standardEntry'
    compounds:
      deprecated: true
      description: |
        Not supported. The API rejects this property with HTTP 400.
        You cannot turn off the built-in compounds dictionary.
      $ref: '#/standardEntry'

standardEntry:
  oneOf:
    - type: object
      description: Key-value pair of a language ISO code and a boolean value.
      example:
        fr: false
      additionalProperties:
        x-additionalPropertiesName: language
        type: boolean
    - type: 'null'
