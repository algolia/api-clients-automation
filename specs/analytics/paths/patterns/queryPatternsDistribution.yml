post:
  tags:
    - pattern
  operationId: queryPatternsDistribution
  x-acl:
    - analytics
  summary: (Beta) Query a numeric distribution
  description: |
    **Beta**: this endpoint is under active development and may change without notice.

    Buckets one or more numeric fields into histograms and returns an object keyed by `histogram<Field>`,
    each mapping a bin label to a count. `distributions` and `parameters` are required; `filters` is
    optional. Discover valid field kinds per domain with `/3/patterns/fields`.
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: '../../common/schemas/patterns.yml#/DistributionPayload'
  responses:
    '200':
      description: OK
      headers:
        x-ratelimit-limit:
          $ref: '../../../common/responses/rateLimit.yml#/x-ratelimit-limit'
        x-ratelimit-remaining:
          $ref: '../../../common/responses/rateLimit.yml#/x-ratelimit-remaining'
        x-ratelimit-reset:
          $ref: '../../../common/responses/rateLimit.yml#/x-ratelimit-reset'
      content:
        application/json:
          schema:
            $ref: '../../common/schemas/patterns.yml#/DistributionResponse'
    '400':
      $ref: '../../../common/responses/BadRequest.yml'
    '402':
      $ref: '../../../common/responses/FeatureNotEnabled.yml'
    '403':
      $ref: '../../../common/responses/MethodNotAllowed.yml'
    '404':
      $ref: '../../../common/responses/IndexNotFound.yml'
