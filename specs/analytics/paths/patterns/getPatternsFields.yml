get:
  tags:
    - pattern
  operationId: getPatternsFields
  x-acl:
    - analytics
  summary: (Beta) Retrieve the field catalog
  description: |
    **Beta**: this endpoint is under active development and may change without notice.

    Returns the catalog of analytics fields available to the caller, grouped by domain and usage
    (metrics, filters, groups, distributions). Use it to discover valid `(domain, kind)` pairs before
    building the other `/3/patterns/*` queries. Two fields are combinable in one query only when their
    `roots` intersect.
  parameters:
    - in: header
      name: If-None-Match
      required: false
      description: Prior `ETag`. Returns `304 Not Modified` when the catalog is unchanged.
      schema:
        type: string
  responses:
    '200':
      description: OK
      headers:
        x-ratelimit-limit:
          $ref: '../../../common/responses/rateLimit.yml#/x-ratelimit-limit'
        x-ratelimit-remaining:
          $ref: '../../../common/responses/rateLimit.yml#/x-ratelimit-remaining'
        x-ratelimit-reset:
          $ref: '../../../common/responses/rateLimit.yml#/x-ratelimit-reset'
      content:
        application/json:
          schema:
            $ref: '../../common/schemas/patterns.yml#/Catalog'
    '304':
      description: Not Modified — the catalog matches the supplied `If-None-Match`.
    '400':
      $ref: '../../../common/responses/BadRequest.yml'
    '402':
      $ref: '../../../common/responses/FeatureNotEnabled.yml'
    '403':
      $ref: '../../../common/responses/MethodNotAllowed.yml'
