feeds:
  title: Run composition feeds as object
  type: object
  description: |
    Per-feed parameters, only for `multifeed` compositions. Keyed by feed ID.

    Feed `params` take precedence over the root `params`.
    Keys a feed doesn't set are inherited from the root `params`.
    A feed value replaces the root value, it isn't combined with it.
    This applies to every key, including `filters`, `facetFilters`, `optionalFilters`, and `analyticsTags`.
    For example, `filters` must repeat the common values, and an empty value such as `filters: ""` discards the root value.

    Feed `params` are validated like the root `params`. Unsupported parameters return a 400 error.

    A feed ID that doesn't exist in the composition (for example, because a rule removed it) is reported in the `errors` field of the response and doesn't fail the request.

    Composition rules match once per request, using the root `params` only.
  additionalProperties:
    title: feedRequest
    type: object
    additionalProperties: false
    properties:
      params:
        $ref: '#/feedParams'
  example:
    organic:
      params:
        filters: 'category:shoes'
        hitsPerPage: 20
    banner:
      params:
        hitsPerPage: 2
        sortBy: ''

