searchResponse:
  additionalProperties: true
  allOf:
    - $ref: './runResponseComponents/CompositionsRunSection.yml#/compositionBaseSearchResponse'
    - $ref: '#/searchResults'

searchResults:
  type: object
  additionalProperties: false
  properties:
    results:
      type: array
      description: Search results.
      items:
        $ref: './runResponseComponents/SingleResultSet.yml#/searchResultsItem'
    errors:
      type: array
      description: Non-critical errors encountered while processing the request that may have affected the returned results (for example, an external provider failure that fell back to another result set).
      items:
        $ref: '#/processingError'
  required:
    - results

processingError:
  type: object
  additionalProperties: false
  properties:
    message:
      type: string
      description: Description of the non-critical error.
  required:
    - message
