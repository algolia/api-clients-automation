# Base shape of a recommend source. Incomplete on its own — a consumer MUST
# allOf-merge this with its own `queryParameters`/`fallbackParameters`
# properties (the query-parameter allowlist for its context) to form a
# complete, usable source schema.
baseRecommendSource:
  type: object
  additionalProperties: false
  properties:
    indexName:
      type: string
      description: Index to retrieve recommendations from.
      example: Products
    model:
      $ref: '#/model'
    threshold:
      type: integer
      minimum: 0
      maximum: 100
      description: Minimum score a recommendation must have to be included.
  required:
    - indexName
    - model
    - threshold

model:
  type: string
  enum:
    - trending-items
  description: Recommendation model to use for retrieving recommendations.
  example: trending-items
