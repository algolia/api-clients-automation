# Base shape of an external (customer-provided objectIDs) source. Incomplete
# on its own — a consumer MUST allOf-merge this with its own `params`
# property (the query-parameter allowlist for its context) to form a
# complete, usable source schema.
baseExternalSource:
  type: object
  additionalProperties: false
  properties:
    index:
      type: string
      description: Algolia index used to retrieve records.
      example: Products
    ordering:
      $ref: '#/externalOrdering'
  required:
    - index

externalOrdering:
  description: Ordering to apply on the injected items coming from the external source. 'default' means the items will be ordered as they are in the index (natural relevance) in the smart group. 'userDefined' means the order in which the objectIDs are provided in the run request payload will be preserved in the smart group.
  enum: ['default', 'userDefined']
  default: 'default'
