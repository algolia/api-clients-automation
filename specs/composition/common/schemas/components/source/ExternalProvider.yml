# Base shape of an external-provider source. Incomplete on its own — a
# consumer MUST allOf-merge this with its own `params` property (the
# query-parameter allowlist for its context) to form a complete, usable
# source schema.
baseExternalProviderSource:
  type: object
  additionalProperties: false
  properties:
    index:
      type: string
      description: Algolia index used to fetch the records.
      example: Products
    configurationID:
      type: string
      description: Identifier of the external provider configuration.
      example: 'my-rmn-connection'
    configurationParams:
      type: object
      additionalProperties: true
      description: Default values for the configuration placeholders that are not reserved Composition placeholders.
      example: {campaign_id: 'winter-sale', customer_id: 'user123'}
    ordering:
      $ref: '#/externalProviderOrdering'
  required:
    - index
    - configurationID

externalProviderOrdering:
  type: string
  description: |
    Ordering to apply on the items retrieved from the external provider. 'default' uses the relevance ranking from the Algolia retrieval step. 'providerDefined' uses the ordering returned by the external provider.
  enum: ['default', 'providerDefined']
  default: 'providerDefined'
