post:
  tags:
    - Compositions
  operationId: updateSortingStrategyComposition
  x-acl:
    - editSettings
  summary: Set or update the "sortingStrategy" configuration for an existing composition
  description: |
    Updates the "sortingStrategy" field of an existing composition.
    This endpoint lets you create a new sorting strategy mapping or replace the configured one.
    This endpoint doesn't validate the sorting indices.
    At runtime, the API ignores a sorting index that is unrelated to the targeted indices.
    The response reports it in the `errors` field.

    The update is applied to the specified composition within the current Algolia application and returns a taskID that can be used to track the operation’s completion.
  parameters:
    - $ref: '../urlParams.yml#/compositionID'
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: '../../common/schemas/components/Composition.yml#/sortingStrategy'
  responses:
    '200':
      description: OK
      headers:
        Correlation-ID:
          $ref: '../../common/responses/correlationId.yml#/Correlation-ID'
      content:
        application/json:
          schema:
            title: taskIDResponse
            type: object
            additionalProperties: false
            properties:
              taskID:
                $ref: '../../../common/responses/common.yml#/taskID'
            required:
              - taskID
    '400':
      $ref: '../../../common/responses/BadRequest.yml'
    '402':
      $ref: '../../../common/responses/FeatureNotEnabled.yml'
    '403':
      $ref: '../../../common/responses/MethodNotAllowed.yml'
    '404':
      $ref: '../../../common/responses/CompositionNotFound.yml'
