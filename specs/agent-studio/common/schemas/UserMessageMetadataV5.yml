UserMessageMetadataV5:
  additionalProperties: true
  description: |-
    Client-supplied metadata on a v5 user message.

    `turn_context` is namespaced so other callers can use `metadata` for unrelated
    purposes without collision. Unknown keys are preserved and ignored by this pipeline.

    `turn_context` accepts any JSON object (arbitrarily nested values, no size caps).
    It is deliberately typed `dict[str, Any]` (not `TurnContext`): the metadata is
    parsed eagerly with the request body, but the serializability check must be
    deferred to `extract_turn_context_v5` so the kill-switch
    (`TURN_CONTEXT_ENABLED=false`) can silently drop payloads instead of 422-ing.
    See `test_unserializable_metadata_does_not_raise_at_model_construction`.
  properties:
    turnContext:
      oneOf:
      - additionalProperties: true
        type: object
      - type: 'null'
      default: null
      title: turncontext
  title: userMessageMetadataV5
  type: object
