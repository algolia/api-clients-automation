UserMessageMetadataV5:
  additionalProperties: true
  description: |-
    Client-supplied metadata on a v5 user message.

    `turn_context` is namespaced so other callers can use `metadata` for unrelated
    purposes without collision. Unknown keys are preserved and ignored by this pipeline.

    `turn_context` accepts any JSON object (arbitrarily nested values, no size caps).
    A value that cannot be serialized as JSON is rejected with a 422.
  properties:
    turnContext:
      oneOf:
      - additionalProperties: true
        type: object
      - type: 'null'
      default: null
      title: turncontext
  title: userMessageMetadataV5
  type: object
