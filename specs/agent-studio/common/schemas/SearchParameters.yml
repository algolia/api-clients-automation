SearchParameters:
  description: |-
    Algolia Search API parameters that can be predefined for the search tool.
    Reference: https://www.algolia.com/doc/api-reference/search-api-parameters/

    The parameters that seemed irrelevant for the search tool have been commented out.
    Uses types from algoliasearch.search.models for better type safety.
  properties:
    queryType:
      oneOf:
      - $ref: QueryType.yml#/QueryType
      - type: 'null'
    similarQuery:
      oneOf:
      - type: string
      - type: 'null'
      default: null
      title: similarquery
    queryLanguages:
      $ref: QueryLanguagesUnion.yml#/QueryLanguagesUnion
    advancedSyntax:
      oneOf:
      - type: boolean
      - type: 'null'
      default: null
      title: advancedsyntax
    advancedSyntaxFeatures:
      $ref: AdvancedSyntaxFeaturesUnion.yml#/AdvancedSyntaxFeaturesUnion
    alternativesAsExact:
      $ref: AlternativesAsExactUnion.yml#/AlternativesAsExactUnion
    decompoundQuery:
      oneOf:
      - type: boolean
      - type: 'null'
      default: null
      title: decompoundquery
    typoTolerance:
      $ref: TypoToleranceUnion.yml#/TypoToleranceUnion
    allowTyposOnNumericTokens:
      oneOf:
      - type: boolean
      - type: 'null'
      default: null
      title: allowtyposonnumerictokens
    minWordSizeFor1Typo:
      oneOf:
      - type: integer
      - type: 'null'
      default: null
      title: minwordsizefor1Typo
    minWordSizeFor2Typos:
      oneOf:
      - type: integer
      - type: 'null'
      default: null
      title: minwordsizefor2Typos
    disableTypoToleranceOnAttributes:
      oneOf:
      - items:
          type: string
        type: array
      - type: 'null'
      default: null
      title: disabletypotoleranceonattributes
    filters:
      oneOf:
      - type: string
      - type: 'null'
      default: null
      title: filters
    facetFilters:
      oneOf:
      - $ref: FacetFiltersUnion.yml#/FacetFiltersUnion
      - type: 'null'
    facets:
      $ref: FacetsUnion.yml#/FacetsUnion
    maxValuesPerFacet:
      oneOf:
      - type: integer
      - type: 'null'
      default: null
      title: maxvaluesperfacet
    maxFacetHits:
      oneOf:
      - type: integer
      - type: 'null'
      default: null
      title: maxfacethits
    facetingAfterDistinct:
      oneOf:
      - type: boolean
      - type: 'null'
      default: null
      title: facetingafterdistinct
    sortFacetValuesBy:
      oneOf:
      - type: string
      - type: 'null'
      default: null
      title: sortfacetvaluesby
    numericFilters:
      $ref: NumericFiltersUnion.yml#/NumericFiltersUnion
    tagFilters:
      $ref: TagFiltersUnion.yml#/TagFiltersUnion
    sumOrFiltersScores:
      oneOf:
      - type: boolean
      - type: 'null'
      default: null
      title: sumorfiltersscores
    aroundLatLng:
      oneOf:
      - type: string
      - type: 'null'
      default: null
      title: aroundlatlng
    aroundLatLngViaIp:
      oneOf:
      - type: boolean
      - type: 'null'
      default: null
      title: aroundlatlngviaip
    aroundRadius:
      $ref: AroundRadiusUnion.yml#/AroundRadiusUnion
    aroundPrecision:
      $ref: AroundPrecisionUnion.yml#/AroundPrecisionUnion
    minimumAroundRadius:
      oneOf:
      - type: integer
      - type: 'null'
      default: null
      title: minimumaroundradius
    insideBoundingBox:
      $ref: InsideBoundingBoxUnion.yml#/InsideBoundingBoxUnion
    insidePolygon:
      $ref: InsidePolygonUnion.yml#/InsidePolygonUnion
    attributesToRetrieve:
      oneOf:
      - items:
          type: string
        type: array
      - type: 'null'
      default: null
      title: attributestoretrieve
    attributesToSnippet:
      oneOf:
      - items:
          type: string
        type: array
      - type: 'null'
      default: null
      title: attributestosnippet
    snippetEllipsisText:
      oneOf:
      - type: string
      - type: 'null'
      default: null
      title: snippetellipsistext
    restrictHighlightAndSnippetArrays:
      oneOf:
      - type: boolean
      - type: 'null'
      default: null
      title: restricthighlightandsnippetarrays
    page:
      oneOf:
      - type: integer
      - type: 'null'
      default: null
      title: page
    offset:
      oneOf:
      - type: integer
      - type: 'null'
      default: null
      title: offset
    hitsPerPage:
      oneOf:
      - type: integer
      - type: 'null'
      default: null
      title: hitsperpage
    length:
      oneOf:
      - type: integer
      - type: 'null'
      default: null
      title: length
    getRankingInfo:
      oneOf:
      - type: boolean
      - type: 'null'
      default: null
      title: getrankinginfo
    relevancyStrictness:
      oneOf:
      - type: integer
      - type: 'null'
      default: null
      title: relevancystrictness
    minProximity:
      oneOf:
      - type: integer
      - type: 'null'
      default: null
      title: minproximity
    attributeCriteriaComputedByMinProximity:
      oneOf:
      - type: boolean
      - type: 'null'
      default: null
      title: attributecriteriacomputedbyminproximity
    distinct:
      $ref: DistinctUnion.yml#/DistinctUnion
    enableRules:
      oneOf:
      - type: boolean
      - type: 'null'
      default: null
      title: enablerules
    enablePersonalization:
      oneOf:
      - type: boolean
      - type: 'null'
      default: null
      title: enablepersonalization
    personalizationImpact:
      oneOf:
      - type: integer
      - type: 'null'
      default: null
      title: personalizationimpact
    enableAbTest:
      oneOf:
      - type: boolean
      - type: 'null'
      default: null
      title: enableabtest
    enableReRanking:
      oneOf:
      - type: boolean
      - type: 'null'
      default: null
      title: enablereranking
    reRankingApplyFilter:
      $ref: ReRankingApplyFilterUnion.yml#/ReRankingApplyFilterUnion
    ruleContexts:
      oneOf:
      - items:
          type: string
        type: array
      - type: 'null'
      default: null
      title: rulecontexts
    removeStopWords:
      $ref: RemoveStopWordsUnion.yml#/RemoveStopWordsUnion
    ignorePlurals:
      $ref: IgnorePluralsUnion.yml#/IgnorePluralsUnion
    removeWordsIfNoResults:
      oneOf:
      - $ref: RemoveWordsIfNoResults.yml#/RemoveWordsIfNoResults
      - type: 'null'
    optionalWords:
      $ref: OptionalWordsUnion.yml#/OptionalWordsUnion
    optionalFilters:
      $ref: OptionalFiltersUnion.yml#/OptionalFiltersUnion
    synonyms:
      oneOf:
      - type: boolean
      - type: 'null'
      default: null
      title: synonyms
    replaceSynonymsInHighlight:
      oneOf:
      - type: boolean
      - type: 'null'
      default: null
      title: replacesynonymsinhighlight
    analytics:
      oneOf:
      - type: boolean
      - type: 'null'
      default: null
      title: analytics
    analyticsTags:
      oneOf:
      - items:
          type: string
        type: array
      - type: 'null'
      default: null
      title: analyticstags
    clickAnalytics:
      oneOf:
      - type: boolean
      - type: 'null'
      default: null
      title: clickanalytics
    userToken:
      oneOf:
      - type: string
      - type: 'null'
      default: null
      title: usertoken
    restrictSearchableAttributes:
      oneOf:
      - items:
          type: string
        type: array
      - type: 'null'
      default: null
      title: restrictsearchableattributes
    disableExactOnAttributes:
      oneOf:
      - items:
          type: string
        type: array
      - type: 'null'
      default: null
      title: disableexactonattributes
    exactOnSingleWordQuery:
      oneOf:
      - $ref: ExactOnSingleWordQuery.yml#/ExactOnSingleWordQuery
      - type: 'null'
    naturalLanguages:
      $ref: NaturalLanguagesUnion.yml#/NaturalLanguagesUnion
    percentileComputation:
      oneOf:
      - type: boolean
      - type: 'null'
      default: null
      title: percentilecomputation
    explain:
      oneOf:
      - items:
          type: string
        type: array
      - type: 'null'
      default: null
      title: explain
  title: searchParameters
  type: object
