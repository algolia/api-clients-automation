AlgoliaGroupedResultsToolConfig:
  description: Configuration for the algolia_grouped_results tool.
  properties:
    name:
      const: algolia_grouped_results
      default: algolia_grouped_results
      title: name
      type: string
    isTerminal:
      default: false
      description: When true, a successful tool invocation ends the agent graph (no
        further LLM turn). Use for chat experiences where the tool payload IS the
        final response. Leave false to let the main LLM produce a concluding assistant
        message after the tool runs.
      title: isterminal
      type: boolean
    minGroups:
      default: 1
      description: minimum number of result groups.
      maximum: 6
      minimum: 1
      title: mingroups
      type: integer
    maxGroups:
      default: 3
      description: maximum number of result groups.
      maximum: 6
      minimum: 1
      title: maxgroups
      type: integer
    minResultsPerGroup:
      default: 3
      description: minimum hits per group.
      maximum: 15
      minimum: 1
      title: minresultspergroup
      type: integer
    maxResultsPerGroup:
      default: 6
      description: maximum hits per group.
      maximum: 15
      minimum: 1
      title: maxresultspergroup
      type: integer
    type:
      const: algolia_grouped_results
      default: algolia_grouped_results
      title: type
      type: string
  title: algoliaGroupedResultsToolConfig
  type: object
  required:
  - type
