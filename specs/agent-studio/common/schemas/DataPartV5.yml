DataPartV5:
  description: |-
    AI SDK v5 transient data part (``type`` prefixed with ``data-``).

    We emit these on the streamed assistant response (e.g. ``data-suggestions``,
    ``data-tool-approval``, ``data-*-usage``, etc.).
    The client echoes the whole assistant message back as history on the next turn, so the
    inbound schema must tolerate them or the entire request 422s. They carry UI payload only
    (not model context) and are dropped on conversion to internal messages.
  properties:
    type:
      title: type
      type: string
    data:
      type: object
      additionalProperties: true
      title: data
  required:
  - type
  title: dataPartV5
  type: object
