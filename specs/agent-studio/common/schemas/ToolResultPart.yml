ToolResultPart:
  properties:
    type:
      type: string
      const: tool-result
      title: type
      default: tool-result
    toolCallId:
      type: string
      title: toolcallid
    toolName:
      type: string
      title: toolname
    output:
      $ref: ToolResultOutput.yml#/ToolResultOutput
    providerOptions:
      oneOf:
      - type: object
        additionalProperties: true
      - type: 'null'
      title: provideroptions
    mcpConfigId:
      oneOf:
      - type: string
      - type: 'null'
      title: mcpconfigid
    mcpConfigName:
      oneOf:
      - type: string
      - type: 'null'
      title: mcpconfigname
    isTerminal:
      oneOf:
      - type: boolean
      - type: 'null'
      title: isterminal
    outputMetadata:
      oneOf:
      - additionalProperties: true
        type: object
      - type: 'null'
      title: outputmetadata
  type: object
  required:
  - type
  - toolCallId
  - toolName
  - output
  title: toolResultPart
