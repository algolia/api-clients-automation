SearchParametersOverrides:
  additionalProperties: false
  description: |-
    Algolia Search API parameters that can be predefined for the search tool.
    Reference: https://www.algolia.com/doc/api-reference/search-api-parameters/

    A subset of SearchParameters of specific params we allow for runtime override.
  properties:
    filters:
      type: string
      default: null
      title: filters
    attributesToRetrieve:
      items:
        type: string
      type: array
      default: null
      title: attributestoretrieve
    restrictSearchableAttributes:
      items:
        type: string
      type: array
      default: null
      title: restrictsearchableattributes
    distinct:
      $ref: DistinctUnion.yml#/DistinctUnion
    userToken:
      type: string
      default: null
      title: usertoken
    enablePersonalization:
      type: boolean
      default: null
      title: enablepersonalization
    personalizationImpact:
      type: integer
      default: null
      title: personalizationimpact
    optionalFilters:
      $ref: OptionalFiltersUnion.yml#/OptionalFiltersUnion
  title: searchParametersOverrides
  type: object
