MessageResponse:
  properties:
    id:
      type: string
      title: id
    conversationId:
      type: string
      title: conversationid
    role:
      $ref: MessageRole.yml#/MessageRole
    parts:
      items:
        $ref: MessagePart.yml#/MessagePart
      type: array
      title: parts
    createdAt:
      type: string
      title: createdat
    updatedAt:
      type: string
      title: updatedat
    model:
      oneOf:
      - type: string
      - type: 'null'
      title: model
    inputTokens:
      oneOf:
      - type: integer
      - type: 'null'
      title: inputtokens
    outputTokens:
      oneOf:
      - type: integer
      - type: 'null'
      title: outputtokens
    reasoningTokens:
      oneOf:
      - type: integer
      - type: 'null'
      title: reasoningtokens
    inputTokenDetails:
      oneOf:
      - additionalProperties:
          type: integer
        type: object
      - type: 'null'
      title: inputtokendetails
    outputTokenDetails:
      oneOf:
      - additionalProperties:
          type: integer
        type: object
      - type: 'null'
      title: outputtokendetails
    isCacheHit:
      oneOf:
      - type: boolean
      - type: 'null'
      title: iscachehit
    turnContext:
      oneOf:
      - additionalProperties: true
        type: object
      - type: 'null'
      title: turncontext
    events:
      items:
        $ref: MessageEvent.yml#/MessageEvent
      type: array
      title: events
    guardrail:
      oneOf:
      - $ref: GuardrailOutcome.yml#/GuardrailOutcome
      - type: 'null'
  type: object
  required:
  - id
  - conversationId
  - role
  - parts
  - createdAt
  - updatedAt
  title: messageResponse
  description: Response model for a message.
