ClientSideToolConfig:
  properties:
    name:
      maxLength: 32
      minLength: 3
      title: name
      type: string
    type:
      const: client_side
      default: client_side
      title: type
      type: string
    description:
      maxLength: 200
      minLength: 1
      title: description
      type: string
    inputSchema:
      $ref: ClientToolsArgsSchema.yml#/ClientToolsArgsSchema
    isTerminal:
      default: false
      description: 'Server-side declaration that this tool is display/render-only:
        a resolved result ends the turn and the model is not re-invoked on it (CR-11753).
        The client''s terminal claim on a tool result is honored only when this agrees;
        leave false for data tools whose result the model must reason about.'
      title: isterminal
      type: boolean
  required:
  - type
  - name
  - description
  - inputSchema
  title: clientSideToolConfig
  type: object
