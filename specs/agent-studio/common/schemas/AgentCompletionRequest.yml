AgentCompletionRequest:
  description: Request model for creating a completion for an assistant.
  properties:
    configuration:
      $ref: AgentTestConfiguration.yml#/AgentTestConfiguration
    messages:
      $ref: MessagesUnionAgentCompletionRequest.yml#/MessagesUnionAgentCompletionRequest
    id:
      maxLength: 128
      type: string
      default: null
      description: Optional conversation id.
      title: id
    algolia:
      $ref: AgentCompletionAlgoliaParams.yml#/AgentCompletionAlgoliaParams
    toolApprovals:
      type: object
      title: toolApprovals
      description: Approval decisions for pending tool calls keyed by toolCallId.
  title: agentCompletionRequest
  type: object
