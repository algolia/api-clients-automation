ProviderAuthenticationResponse:
  properties:
    id:
      type: string
      title: id
    name:
      type: string
      title: name
    providerName:
      type: string
      title: providername
    input:
      $ref: InputUnion.yml#/InputUnion
    createdAt:
      type: string
      title: createdat
    updatedAt:
      type: string
      title: updatedat
    lastUsedAt:
      oneOf:
      - type: string
      - type: 'null'
      title: lastusedat
    isAlgoliaManaged:
      type: boolean
      title: isalgoliamanaged
      default: false
  type: object
  required:
  - id
  - name
  - providerName
  - input
  - createdAt
  - updatedAt
  title: provider
