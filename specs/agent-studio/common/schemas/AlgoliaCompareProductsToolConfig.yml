AlgoliaCompareProductsToolConfig:
  description: Configuration for the algolia_compare_products tool.
  properties:
    name:
      const: algolia_compare_products
      default: algolia_compare_products
      title: name
      type: string
    type:
      const: algolia_compare_products
      default: algolia_compare_products
      title: type
      type: string
    description:
      oneOf:
        - maxLength: 200
          minLength: 1
          type: string
        - type: 'null'
      default: null
      description: What the tool does, as the agent reads it. Leave unset to use the
        default description.
      title: description
  title: algoliaCompareProductsToolConfig
  type: object
  required:
    - type
