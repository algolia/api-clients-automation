AlgoliaDisplayResultsToolConfig:
  description: Configuration for the algolia_display_results tool.
  properties:
    name:
      const: algolia_display_results
      default: algolia_display_results
      title: name
      type: string
    type:
      const: algolia_display_results
      default: algolia_display_results
      title: type
      type: string
    isTerminal:
      default: false
      description: When true, a successful tool invocation ends the agent graph (no
        further LLM turn). Use for chat experiences where the display payload IS the
        final response. Leave false to let the main LLM produce a concluding assistant
        message after the tool runs.
      title: isterminal
      type: boolean
    minGroups:
      default: 1
      description: minimum number of result groups.
      minimum: 1
      title: mingroups
      type: integer
    maxGroups:
      default: 3
      description: maximum number of result groups.
      minimum: 1
      title: maxgroups
      type: integer
    minResultsPerGroup:
      default: 3
      description: minimum hits per group.
      minimum: 1
      title: minresultspergroup
      type: integer
    maxResultsPerGroup:
      default: 6
      description: maximum hits per group.
      minimum: 1
      title: maxresultspergroup
      type: integer
  title: algoliaDisplayResultsToolConfig
  type: object
  required:
  - type
