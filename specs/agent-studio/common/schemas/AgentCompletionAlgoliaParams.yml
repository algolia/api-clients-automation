AgentCompletionAlgoliaParams:
  properties:
    mcpServers:
      additionalProperties:
        additionalProperties:
          additionalProperties:
            type: string
          type: object
        type: object
      type: object
      default: null
      title: mcpservers
    searchParameters:
      $ref: SearchParametersOverridesMapNullable.yml#/SearchParametersOverridesMapNullable
    indices:
      items:
        maxLength: 100
        minLength: 1
        pattern: ^[a-zA-Z0-9_\-.]+$
        type: string
      maxItems: 10
      type: array
      default: null
      description: Per-request override for the Algolia Search tool's indices, honored
        only when the tool is configured with `mode="dynamic"`. A list of index names;
        the API looks up each name in the agent's static `tool.indices` and reuses
        that entry, including its description and access-control fields. A name the
        agent configuration does not list is rejected with HTTP 422 (`index_not_listed_on_tool`)
        unless the tool sets `allowUnlistedIndices`, in which case the API synthesizes
        a minimal entry carrying the index name only. Capped at 10 entries. Sending
        this field against an agent whose tool is in `mode="static"` (the default)
        is rejected with HTTP 422 — change the tool's `mode` in the agent configuration
        first. Defaults to `null`, which preserves the existing static behavior.
      examples:
      - - docs_v9
        - docs_v10
      title: indices
  title: agentCompletionAlgoliaParams
  type: object
