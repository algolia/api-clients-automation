StringArrayParam:
  description: A string array search parameter with exposure control, constraints,
    and merge behavior.
  properties:
    exposed:
      title: exposed
      type: boolean
    default:
      oneOf:
      - items:
          type: string
        type: array
      - type: 'null'
      default: null
      title: default
    constraint:
      oneOf:
      - $ref: StringArrayParamConstraint.yml#/StringArrayParamConstraint
      - type: 'null'
    merge:
      oneOf:
      - type: boolean
      - type: 'null'
      default: null
      title: merge
  required:
  - exposed
  title: stringArrayParam
  type: object
