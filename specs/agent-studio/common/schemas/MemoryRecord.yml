MemoryRecord:
  properties:
    memoryType:
      $ref: MemoryType.yml#/MemoryType
    episode:
      oneOf:
      - $ref: Episode.yml#/Episode
      - type: 'null'
    text:
      type: string
      maxLength: 2000
      minLength: 1
      title: text
      description: Self-contained, first-person memory for long-term recall.
    rawExtract:
      type: string
      maxLength: 5000
      minLength: 1
      title: rawextract
      description: Verbatim conversation extract, not paraphrased.
    keywords:
      items:
        type: string
      type: array
      title: keywords
      description: 'Keywords for retrieval: entities, context, search terms.'
    topics:
      items:
        type: string
      type: array
      title: topics
      description: 'Topics that classify the memory. Each must be one of: [complaints,
        entertainment, family, feedback, finance, food, goals, health, history, hobbies,
        learning, praise, preferences, schedule, shopping, technical, travel, work].'
    _tags:
      items:
        type: string
      type: array
      title: tags
      description: Arbitrary labels/themes for flexible categorization (e.g., 'Q1-goals',
        'paris-trip', 'vip-customer').
    recallTriggers:
      items:
        type: string
      type: array
      title: recalltriggers
      description: Phrases that cause the API to recall this memory.
    objectID:
      oneOf:
      - type: string
      - type: 'null'
      title: objectid
      description: ObjectID of existing memory to update. Leave empty for new memory.
    appId:
      type: string
      title: appid
      description: Application ID.
      default: ''
    agentIDs:
      items:
        type: string
      type: array
      title: agentids
      description: 'Agent IDs with access: [''agent1''], [''*''] for all, [''*'',
        ''-agent1''] to exclude.'
    userID:
      type: string
      title: userid
      description: User ID.
      default: ''
    createdAt:
      type: integer
      title: createdat
      description: Epoch seconds.
      default: 0
    updatedAt:
      type: integer
      title: updatedat
      description: Epoch seconds.
      default: 0
  type: object
  required:
  - text
  - rawExtract
  title: memoryRecord
  description: A stored memory record.
