get:
  tags:
    - Configurations
  operationId: listConversationUsage
  x-acl:
    - logs
  summary: Get Conversation Usage
  description: Live conversations counted against the per-application limit.
  responses:
    '200':
      description: Successful Response.
      content:
        application/json:
          schema:
            $ref: '../../common/schemas/ConversationUsageResponse.yml#/ConversationUsageResponse'
    '422':
      description: Validation Error.
      content:
        application/json:
          schema:
            $ref: '../../common/schemas/HTTPValidationError.yml#/HTTPValidationError'
