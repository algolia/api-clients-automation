name: Release

# This file is registered in https://rubygems.org/gems/algolia/trusted_publishers to be able to publish new versions of the gem.

on:
  push:
    branches:
      - main

jobs:
  release:
    name: Publish
    runs-on: ubuntu-26.04
    if: "startsWith(github.event.head_commit.message, 'chore: release')"
    permissions:
      id-token: write
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Ruby
        uses: ruby/setup-ruby@f9c4492e86def3e644ab32a0ef185eda5b0c20d0 # v1.342.0
        with:
          ruby-version: 4.0.10
          bundler-cache: true

      - uses: rubygems/release-gem@2654a0fe0dc39725c07fe84d7fe863a084f2424e # v1.5.0
        with:
          await-release: false
