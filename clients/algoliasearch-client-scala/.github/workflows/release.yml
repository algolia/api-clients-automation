name: Publish jar

on:
  push:
    tags:
      - v*

jobs:
  release:
    name: Publish to Maven Central
    runs-on: ubuntu-22.04
    if: "startsWith(github.event.head_commit.message, 'chore: release')"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-tags: true
          ref: ${{ github.ref }}

      - name: Install Java
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: zulu
          java-version: 17
          cache: sbt

      - name: Compile
        run: sbt +compile

      # sbt 2.x runs `sbt <command>` through a thin client talking to a server
      # started in the background by the first invocation. That server keeps the
      # environment of the step that started it, so a later `sbt ci-release`
      # would reuse it, never see the secrets below, and silently do nothing
      # ("No access to secret variables, doing nothing").
      - name: Shutdown sbt server
        run: sbt shutdown

      - name: Publish
        run: |
          for name in PGP_PASSPHRASE PGP_SECRET SONATYPE_USERNAME SONATYPE_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::Secret for $name is empty, refusing to publish nothing"
              exit 1
            fi
          done
          sbt ci-release
        env:
          PGP_PASSPHRASE: ${{ secrets.PGP_PASSPHRASE }}
          PGP_SECRET: ${{ secrets.PGP_SECRET }}
          SONATYPE_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          SONATYPE_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
