name: Publish jar

on:
  push:
    tags:
      - v*

jobs:
  release:
    name: Publish to Maven Central
    runs-on: ubuntu-22.04
    if: "startsWith(github.event.head_commit.message, 'chore: release')"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-tags: true
          ref: ${{ github.ref }}

      - name: Install Java
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: zulu
          java-version: 17
          cache: sbt

      - name: Compile
        run: sbt +compile

      - name: Shutdown sbt server
        run: sbt shutdown

      - name: Publish
        run: |
          missing=0
          [ -n "$PGP_PASSPHRASE" ] || { echo "::error::PGP_PASSPHRASE secret is empty"; missing=1; }
          [ -n "$PGP_SECRET" ] || { echo "::error::PGP_SECRET secret is empty"; missing=1; }
          [ -n "$SONATYPE_USERNAME" ] || { echo "::error::MAVEN_CENTRAL_USERNAME secret is empty"; missing=1; }
          [ -n "$SONATYPE_PASSWORD" ] || { echo "::error::MAVEN_CENTRAL_PASSWORD secret is empty"; missing=1; }
          [ "$missing" -eq 0 ] || exit 1
          sbt ci-release
        env:
          PGP_PASSPHRASE: ${{ secrets.PGP_PASSPHRASE }}
          PGP_SECRET: ${{ secrets.PGP_SECRET }}
          SONATYPE_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          SONATYPE_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
