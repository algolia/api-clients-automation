  /2/suggested-actions:
    get:
      tags:
        - suggestions
      operationId: listSuggestions
      x-mcp-tool: true
      x-acl:
        - search
      summary: List suggestions
      description: >
        Lists the active suggestions for an application, optionally narrowed to
        one index.

        Suggestions are sorted from most recently created to oldest.
      parameters:
        - $ref: '#/components/parameters/TargetAppId'
        - $ref: '#/components/parameters/ExcludeDismissed'
        - $ref: '#/components/parameters/TargetIndex'
        - $ref: '#/components/parameters/UserId'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListSuggestionsResponse'
        '400':
          $ref: '#/components/responses/BadRequest-2'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
      x-codeSamples:
        - lang: javascript
          label: JavaScript
          source: >-
            // Initialize the client

            // Replace 'us' with your Algolia Application Region

            const client = suggestedActionsClient('ALGOLIA_APPLICATION_ID',
            'ALGOLIA_API_KEY', 'us');


            // Call the API

            const response = await client.listSuggestions({ targetAppId:
            'MY_APP_ID' });



            // print the response

            console.log(response);
        - lang: cURL
          label: curl
          source: |-
            curl --request GET \
              --url 'https://sact.us.algolia.com/2/suggested-actions?target.appId=a&target.index=lorem&userId=lorem&excludeDismissed=true' \
              --header 'accept: application/json' \
              --header 'x-algolia-api-key: ALGOLIA_API_KEY' \
              --header 'x-algolia-application-id: ALGOLIA_APPLICATION_ID'
  /2/suggested-actions/{suggestionID}:
    get:
      tags:
        - suggestions
      operationId: getSuggestion
      x-mcp-tool: true
      x-acl:
        - search
      summary: Retrieve a suggestion
      description: Retrieves a suggestion by its ID.
      parameters:
        - $ref: '#/components/parameters/SuggestionID'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Suggestion'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
      x-codeSamples:
        - lang: javascript
          label: JavaScript
          source: >-
            // Initialize the client

            // Replace 'us' with your Algolia Application Region

            const client = suggestedActionsClient('ALGOLIA_APPLICATION_ID',
            'ALGOLIA_API_KEY', 'us');


            // Call the API

            const response = await client.getSuggestion({ suggestionID:
            '76710f1b-8231-42e5-b0d1-f43aac618e15' });



            // print the response

            console.log(response);
        - lang: cURL
          label: curl
          source: |-
            curl --request GET \
              --url https://sact.us.algolia.com/2/suggested-actions/fbdf5a53-161e-4460-98ad-0e39408d8689 \
              --header 'accept: application/json' \
              --header 'x-algolia-api-key: ALGOLIA_API_KEY' \
              --header 'x-algolia-application-id: ALGOLIA_APPLICATION_ID'
components:
  securitySchemes:
    appId:
      type: apiKey
      in: header
      name: x-algolia-application-id
      description: Your Algolia application ID.
    apiKey:
      type: apiKey
      in: header
      name: x-algolia-api-key
      description: >
        Your Algolia API key with the necessary permissions to make the request.

        Permissions are controlled through access control lists (ACL) and access
        restrictions.

        The required ACL to make a request is listed in each endpoint's
        reference.
  parameters:
    PathInPath:
      name: path
      in: path
      description: Path of the endpoint, for example `1/newFeature`.
      required: true
      schema:
        type: string
        example: /keys
    Parameters:
      name: parameters
      in: query
      description: Query parameters to apply to the current query.
      schema:
        type: object
        additionalProperties: true
    TargetAppId:
      name: target.appId
      in: query
      required: true
      description: Algolia application ID to list suggestions for.
      schema:
        type: string
        minLength: 1
        pattern: ^[a-zA-Z0-9_-]+$
    TargetIndex:
      name: target.index
      in: query
      description: Only list suggestions that target this index.
      schema:
        type: string
        minLength: 1
    UserId:
      name: userId
      in: query
      description: >
        ID of the user viewing the suggestions.

        When set, suggestions that this user dismissed within the dismissal
        cooldown include `dismissedAt`.
      schema:
        type: string
        minLength: 1
    ExcludeDismissed:
      name: excludeDismissed
      in: query
      description: Whether to leave out the suggestions that `userId` dismissed.
      schema:
        type: boolean
    SuggestionID:
      name: suggestionID
      in: path
      required: true
      description: Unique identifier of the suggestion.
      schema:
        type: string
        format: uuid
  schemas:
    ErrorBase:
      description: Error.
      type: object
      x-keep-model: true
      additionalProperties: true
      properties:
        message:
          type: string
          example: Invalid Application-Id or API-Key
    SuggestionType:
      type: string
      description: >-
        Registered definition from which the service derives the suggestion's
        description and options.
      enum:
        - SUGGESTION_TYPE_UNSPECIFIED
        - ACTIVATE_DYNAMIC_RE_RANKING
        - ACTIVATE_PERSONALIZATION
        - ACTIVATE_NEURAL_SEARCH
        - ACTIVATE_ADVANCED_PERSONALIZATION
    Target:
      type: object
      additionalProperties: false
      required:
        - appId
      properties:
        appId:
          type: string
          minLength: 1
          pattern: ^[a-zA-Z0-9_-]+$
          description: Algolia application ID the suggestion applies to.
        index:
          type: string
          minLength: 1
          description: Index the suggestion applies to, if it targets one index.
    OpenDashboardPageAction:
      type: object
      additionalProperties: false
      description: Opens a page of the Algolia dashboard.
      properties:
        url:
          type: string
          description: URL of the dashboard page.
    GuidedAction:
      type: object
      additionalProperties: false
      properties:
        description:
          type: string
          description: Description of the step.
        openDashboardPage:
          $ref: '#/components/schemas/OpenDashboardPageAction'
    GuidedActionSequence:
      type: object
      additionalProperties: false
      properties:
        actions:
          type: array
          description: Steps to follow, in order.
          items:
            $ref: '#/components/schemas/GuidedAction'
        description:
          type: string
          description: Description of the sequence.
    SuggestionOption:
      type: object
      additionalProperties: false
      properties:
        guidedActionSequence:
          $ref: '#/components/schemas/GuidedActionSequence'
    EvidenceSourceKind:
      type: string
      enum:
        - EVIDENCE_SOURCE_KIND_UNSPECIFIED
        - FEATURE_QUALIFIER
        - FEATURE_FIT
        - OFFLINE_EVALUATION
    Timestamp:
      type: string
      format: date-time
      description: Date and time in RFC 3339 format.
      example: '2026-11-09T10:17:47Z'
    EvidenceSource:
      type: object
      additionalProperties: false
      required:
        - kind
        - id
        - evidence
      properties:
        evidence:
          type: object
          additionalProperties: true
          description: Evidence that the source produced.
        id:
          type: string
          minLength: 1
          description: >
            Identifier of the specific source result, such as a feature
            qualifier or feature fit result ID.

            Together with `kind`, it identifies the evidence source.
        kind:
          $ref: '#/components/schemas/EvidenceSourceKind'
        observedAt:
          $ref: '#/components/schemas/Timestamp'
        version:
          type: string
          minLength: 1
          description: Version of the source.
    Provenance:
      type: object
      additionalProperties: false
      required:
        - sources
      description: Where the evidence for the suggestion comes from.
      properties:
        sources:
          type: array
          minItems: 1
          maxItems: 20
          items:
            $ref: '#/components/schemas/EvidenceSource'
    SuggestionState:
      type: string
      description: Lifecycle state of the suggestion.
      enum:
        - SUGGESTION_STATE_UNSPECIFIED
        - ACTIVE
        - EXPIRED
        - WITHDRAWN
        - COMPLETED
    Source:
      type: string
      description: Who created or completed a suggestion.
      enum:
        - SOURCE_UNSPECIFIED
        - AUTOPILOT
        - ASSIST
        - DASHBOARD
        - OBSERVER
    Completion:
      type: object
      additionalProperties: false
      description: Set once the suggestion is completed, whoever completed it.
      properties:
        completedAt:
          $ref: '#/components/schemas/Timestamp'
        completedBy:
          type: string
          minLength: 1
          maxLength: 256
          description: |
            Who completed the suggestion, such as a dashboard user ID.
            Empty when the observer detected the adoption.
        source:
          $ref: '#/components/schemas/Source'
    Creation:
      type: object
      additionalProperties: false
      properties:
        createdBy:
          type: string
          minLength: 1
          maxLength: 256
          description: >-
            The caller's login, or the user's ID when a user's action created
            the suggestion.
        source:
          $ref: '#/components/schemas/Source'
    Suggestion:
      type: object
      description: A recommended action for an application or an index.
      additionalProperties: false
      properties:
        abTest:
          $ref: '#/components/schemas/SuggestionOption'
        adoptionDetectedAt:
          $ref: '#/components/schemas/Timestamp'
        completion:
          $ref: '#/components/schemas/Completion'
        createdAt:
          $ref: '#/components/schemas/Timestamp'
        creation:
          $ref: '#/components/schemas/Creation'
        description:
          type: string
          description: Description of the suggestion.
        directAdoption:
          $ref: '#/components/schemas/SuggestionOption'
        dismissedAt:
          description: >-
            Set when the `userId` passed to the list request dismissed this
            suggestion within the dismissal cooldown.
          $ref: '#/components/schemas/Timestamp'
        expiresAt:
          $ref: '#/components/schemas/Timestamp'
        id:
          type: string
          description: Unique identifier of the suggestion.
        metadata:
          type: object
          additionalProperties: true
          description: >-
            Context the creator stored with the suggestion. The service doesn't
            interpret it.
        payload:
          type: object
          additionalProperties: true
          description: The change the suggestion makes, in the payload format of its type.
        provenance:
          $ref: '#/components/schemas/Provenance'
        state:
          $ref: '#/components/schemas/SuggestionState'
        target:
          $ref: '#/components/schemas/Target'
        title:
          type: string
          description: Title of the suggestion.
        type:
          $ref: '#/components/schemas/SuggestionType'
        withdrawnAt:
          $ref: '#/components/schemas/Timestamp'
    ListSuggestionsResponse:
      type: object
      additionalProperties: false
      properties:
        suggestions:
          type: array
          description: Active suggestions sorted from most recently created to oldest.
          items:
            $ref: '#/components/schemas/Suggestion'
    Error:
      type: object
      description: Error returned by the Suggested Actions API.
      required:
        - status
        - message
      properties:
        message:
          type: string
          description: Description of the error.
        status:
          type: integer
          description: HTTP status code.
  responses:
    BadRequest:
      description: Bad request or request arguments.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorBase'
    FeatureNotEnabled:
      description: This feature is not enabled on your Algolia account.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorBase'
    MethodNotAllowed:
      description: Method not allowed with this API key.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorBase'
    IndexNotFound:
      description: Index not found.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorBase'
    BadRequest-2:
      description: Bad request.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            status: 400
            message: Bad request.
    Unauthorized:
      description: Unauthorized.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            status: 401
            message: Unauthorized.
    Forbidden:
      description: Forbidden.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            status: 403
            message: Forbidden.
    NotFound:
      description: Not found.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            status: 404
            message: Not found.
x-beta: true
x-tagGroups:
  - name: Suggestions
    tags:
      - suggestions
